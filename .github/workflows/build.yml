name: Build & Package Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (e.g. 2.3.0). Leave empty to use git tag or AssemblyInfo.cs.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore src/FunscriptToolbox.sln

      - name: Determine & Apply Version
        shell: powershell
        run: |
          $ver = "${{ inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($ver)) {
              $ver = "${{ github.ref_name }}"
          }
          if (-not [string]::IsNullOrWhiteSpace($ver)) {
              Write-Host "Applying version: $ver"
              .\scripts\set-version.ps1 -Version $ver
              echo "RESOLVED_VERSION=$ver" >> $env:GITHUB_ENV
          }

      - name: Build Solution (Release)
        run: msbuild src/FunscriptToolbox.sln /p:Configuration=Release /p:Platform="Any CPU" /m

      - name: Package Release Zip
        shell: powershell
        run: |
          $params = @{ Configuration = "Release" }
          if ($env:RESOLVED_VERSION) {
              $params["Version"] = $env:RESOLVED_VERSION
          }
          .\scripts\package-release.ps1 @params

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FunscriptToolbox
          path: dist/FunscriptToolbox.zip
          if-no-files-found: error

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/FunscriptToolbox.zip
            dist/FunscriptToolbox-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
