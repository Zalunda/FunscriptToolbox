name: Build & Package Release (osx-x64)

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (e.g. 2.4.0). Leave empty to use git tag.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-intel:
    name: Build (osx-x64)
    runs-on: macos-13
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine Version
        id: get_version
        shell: bash
        run: |
          RAW_VER="${{ inputs.version }}"
          if [ -z "$RAW_VER" ]; then
            RAW_VER="${{ github.ref_name }}"
          fi
          CLEAN_VER="${RAW_VER#v}"
          if [ -z "$CLEAN_VER" ]; then
            CLEAN_VER="1.0.0"
          fi
          echo "version=$CLEAN_VER" >> $GITHUB_OUTPUT
          echo "Building version: $CLEAN_VER"

      # -------------------------------------------------------------
      # 1. Publish FULL (Self-Contained)
      # -------------------------------------------------------------
      - name: Publish Full (Self-Contained)
        shell: bash
        run: |
          dotnet publish src/FunscriptToolbox/FunscriptToolbox.csproj \
            -c Release \
            -f net10.0 \
            -r osx-x64 \
            --self-contained true \
            -p:Version="${{ steps.get_version.outputs.version }}" \
            -o dist/publish-full

      # -------------------------------------------------------------
      # 2. Publish PARTIAL (Framework-Dependent)
      # -------------------------------------------------------------
      - name: Publish Partial (Framework-Dependent)
        shell: bash
        run: |
          dotnet publish src/FunscriptToolbox/FunscriptToolbox.csproj \
            -c Release \
            -f net10.0 \
            -r osx-x64 \
            --self-contained false \
            -p:Version="${{ steps.get_version.outputs.version }}" \
            -o dist/publish-partial

      # -------------------------------------------------------------
      # 3. Create Release Archives (.tar.gz)
      # -------------------------------------------------------------
      - name: Archive Packages
        shell: bash
        run: |
          VER="${{ steps.get_version.outputs.version }}"
          mkdir -p dist/archives
          tar -czf "dist/archives/FunscriptToolbox-$VER-osx-x64-full.tar.gz" -C dist/publish-full .
          tar -czf "dist/archives/FunscriptToolbox-$VER-osx-x64-partial.tar.gz" -C dist/publish-partial .

      # -------------------------------------------------------------
      # 4. Upload to GitHub Release
      # -------------------------------------------------------------
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/archives/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
