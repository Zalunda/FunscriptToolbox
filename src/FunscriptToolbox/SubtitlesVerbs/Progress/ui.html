    var p = propsOf(sub).filter(function (x) { return sameName(x.name, name); })[0];
    return p ? p.value.trim() : null;
  }
  /// The property is removed from wherever it is (a line that only had it is removed); value not null: then added, on its own line
  /// ("" : {Name} alone).
  function setMeta(sub, name, value) {
    var MARK = "\u0001";
    var text = sub.lines.join("\n").replace(PROP_RE, function (all, n) { return sameName(n, name) ? MARK : all; });
    var lines = [];
    text.split("\n").forEach(function (l) {
      if (l.indexOf(MARK) < 0) { lines.push(l); return; }
      l = l.split(MARK).join("");
      if (l.trim()) lines.push(l);
    });
    if (value != null) lines.push(value === "" ? "{" + name + "}" : "{" + name + ":" + value + "}");
    sub.lines = lines;
  }
  /// The text of the subtitle: without its properties and its review warnings (only to be read: it's not used after this step)
  function textOf(sub) {
    return sub.lines.filter(function (l) { return !parseIssue(l); }).join("\n").replace(PROP_RE, "")
      .split("\n").map(function (l) { return l.trim(); }).filter(function (l) { return l.length > 0; });
  }
  function splitNames(v) { return (v || "").split(",").map(function (x) { return x.trim(); }).filter(function (x) { return x.length > 0; }); }
  /// For each subtitle: the speakers present (the last {ongoing} with names, up to it) and its speaker
  function speakerStates() {
    var cur = [], out = [];
    S.subs.forEach(function (sub) {
      var names = splitNames(getMeta(sub, S.spk.ongoing));
      if (names.length) cur = names;
      out.push({ present: cur, speaker: getMeta(sub, S.spk.speaker) || null });
    });
    return out;
  }
  function presentAt(i) {
    for (var k = i; k >= 0; k--) { var names = splitNames(getMeta(S.subs[k], S.spk.ongoing)); if (names.length) return names; }
    return [];
  }
  function speakerStateAt(i) { return { present: presentAt(i), speaker: getMeta(S.subs[i], S.spk.speaker) || null }; }
  /// "tagged": it has its speaker; "single": only one speaker present; "ai": several present (the AI decides); "none": nobody present
  function speakerKind(st) { return st.speaker ? "tagged" : st.present.length === 1 ? "single" : st.present.length > 1 ? "ai" : "none"; }
  function isKnown(st) { var k = speakerKind(st); return k === "tagged" || k === "single"; }

  function currentPass() { return (S.pass === "speakers" && !S.spk) || !PASSES[S.pass] ? "timing" : S.pass; }
  /// For each subtitle: is it to do in the current pass (computed in one go)
  function todoFlags() {
    var pass = currentPass();
    if (pass === "speakers") return speakerStates().map(function (st) { return !isKnown(st); });
    if (pass === "issues") return S.subs.map(function (x) { return openIssues(x).length > 0; });
    return S.subs.map(function (x) { return !x.v; });
  }
  function isTodo(i) {
    var pass = currentPass();
    if (pass === "speakers") return !isKnown(speakerStateAt(i));
    if (pass === "issues") return openIssues(S.subs[i]).length > 0;
    return !S.subs[i].v;
  }
  /// dir: 1 next, -1 previous (from the selected subtitle; it doesn't go around)
  function goTodo(dir) {
    var flags = todoFlags();
    for (var i = S.sel + dir; i >= 0 && i < S.subs.length; i += dir) {
      if (flags[i]) { select(i); return; }
    }
    status("Nothing to do " + (dir > 0 ? "after" : "before") + " #" + (S.sel + 1) + " in '" + PASSES[currentPass()] + "'" + (currentPass() === "issues" && S.issueFilter ? " (" + filterLabel() + ")" : "") + ".");
  }
  function restoreSel() { if (S.rowEls && S.rowEls[S.sel]) S.rowEls[S.sel].classList.add("sel"); }

  /// The panel of the passes (above the list): the 3 passes, and what goes with the current one (the tree of the warnings, the speakers)
  function renderPass() {
    var el = $("tePass");
    if (!S || !S.info) { el.innerHTML = ""; return; }
    var pass = currentPass(), n = S.subs.length, nTiming = validatedCount();
    var tree = {}, nOpen = 0, nAll = 0;
    S.subs.forEach(function (sub) {
      issuesOf(sub).forEach(function (x) {
        var c = tree[x.code] || (tree[x.code] = { open: 0, all: 0, details: {} });
        c.all++; nAll++;
        if (!x.checked) { c.open++; nOpen++; }
        if (x.detail) {
          var d = c.details[x.detail] || (c.details[x.detail] = { open: 0, all: 0 });
          d.all++; if (!x.checked) d.open++;
        }
      });
    });
    var states = S.spk ? speakerStates() : null;
    var nKnown = states ? states.filter(isKnown).length : 0;
    function tab(id, label, title, disabled) {
      return '<button class="mini' + (pass === id ? " on" : "") + '" data-pass="' + id + '"' + (disabled ? " disabled" : "") + ' title="' + esc(title) + '">' + esc(label) + '</button>';
    }
    renderSpeakerBar();
    // The line above the list: the passes (what is to do, ● in the list) and previous / next to do
    var html = '<div class="te-passtabs">' +
      tab("timing", "⏱ Timing " + nTiming + "/" + n, "Pass 'Timing': to do = the subtitles whose timing is not validated") +
      tab("issues", "⚑ Review warnings " + (nAll - nOpen) + "/" + nAll, "Pass 'Review warnings': to do = the subtitles with a [REVIEW:...] line not checked (of the kind chosen in the tree)") +
      tab("speakers", "👥 Speakers " + nKnown + "/" + n, S.spk
        ? "Pass 'Speakers': to do = the subtitles whose speaker is not known (several speakers present and no {" + S.spk.speaker + "}, or nobody present)"
        : "Not configured: 'SpeakerMetadata' and 'OngoingSpeakersMetadata' of the review (TranscriberInteractifReview)", !S.spk) +
      '<span class="hint" style="margin-left:auto">to do:</span>' +
      '<button class="mini" data-act="prevTodo" title="Previous subtitle to do in the current pass (' + esc(keys.prevTodo || "-") + ')">⇡</button>' +
      '<button class="mini" data-act="nextTodo" title="Next subtitle to do in the current pass (' + esc(keys.nextTodo || "-") + ')">⇣</button></div>';
    el.innerHTML = html;
    // The tab under the video that goes with it (drawn only when it's shown; it stays where the user scrolled)
    function pane(id, content) {
      var p = $(id), top = p.scrollTop;
      p.innerHTML = content;
      p.scrollTop = top;
    }
    if (teTab === "warnings") pane("teWarningsPane", issuesTreeHtml(tree, nOpen, nAll));
    else if (teTab === "properties") renderProps();
  }
  function issuesTreeHtml(tree, nOpen, nAll) {
    if (!nAll) return '<div class="hint">No review warning ([REVIEW:...] line) in these subtitles.</div>';
    var f = S.issueFilter;
    function item(code, detail, label, c, depth) {
      var sel = (!f && code == null) || (f && code === f.code && (detail || null) === (f.detail || null));
      return '<div class="te-ti' + (sel ? " sel" : "") + (c.open ? "" : " done") + '" data-code="' + esc(code || "") + '" data-detail="' + esc(detail || "") + '" style="padding-left:' + (6 + depth * 16) + 'px">' +
        (code ? '<span class="te-dot" style="background:' + issueColor(code) + '"></span>' : "") + esc(label) +
        ' <span class="cnt">' + c.open + ' to check / ' + c.all + '</span></div>';
    }
    var html = '<div class="te-tree">' + item(null, null, "All the warnings", { open: nOpen, all: nAll }, 0);
    Object.keys(tree).sort().forEach(function (code) {
      var c = tree[code];
      html += item(code, null, code, c, 1);
      Object.keys(c.details).sort().forEach(function (d) { html += item(code, d, d, c.details[d], 2); });
    });
    return html + '</div><div class="hint">Click: only these ones (in the pass \'Review warnings\', next to do goes from one to the other). ' + esc(keys.checkIssue || "-") +
      ': the warnings of the selected subtitle are checked, then the next one (again: not checked). To fix one: change the timing / the {metadata}, or delete the subtitle (its text is not used after this step).</div>';
  }
  /// A change of the lines of a subtitle by a pass: one undo; the list is drawn again (the 'to do' of the next ones can change), and the text box
  function changeLines(i, change) {
    if (!canEdit() || !S.subs[i]) return false;
    pushUndo();
    S.textEditing = false;
    change(S.subs[i]);
    renderList(); restoreSel();
    renderCur();
    updateUnsaved();
    S.dirty = true;
    return true;
  }
  function checkSpeakersPass() {
    if (S.spk) return true;
    status("No 'Speakers' pass: 'SpeakerMetadata' and 'OngoingSpeakersMetadata' are not set in the review (TranscriberInteractifReview).", true);
    return false;
  }
  function toggleSpeaker(name) {
    var sub = S.subs[S.sel];
    if (!checkSpeakersPass() || !sub) return;
    var cur = getMeta(sub, S.spk.speaker);
    var same = !!cur && sameName(cur, name);
    if (changeLines(S.sel, function (x) { setMeta(x, S.spk.speaker, same ? null : name); }))
      status("#" + (S.sel + 1) + ": " + (same ? "no {" + S.spk.speaker + "} anymore." : "{" + S.spk.speaker + ":" + name + "}."));
  }
  function speakerByIndex(k) {
    if (!checkSpeakersPass()) return;
    if (!S.speakers[k]) { status("No speaker #" + (k + 1) + " in the list (＋ of the speakers, under the video).", true); return; }
    toggleSpeaker(S.speakers[k].name);
  }
  function speakerNames() { return S.speakers.map(function (sp) { return sp.name; }); }
  function shortName(name) {
    var sp = S.speakers.filter(function (x) { return sameName(x.name, name); })[0];
    return sp && sp.alias ? sp.alias : name;
  }
  /// Present from the selected subtitle on: {ongoing:...} on it, only when it's not the same as before it (otherwise: removed from it)
  function togglePresent(name) {
    var i = S.sel;
    if (!checkSpeakersPass() || !S.subs[i]) return;
    var present = presentAt(i), next;
    if (hasName(present, name)) next = present.filter(function (x) { return !sameName(x, name); });
    else next = speakerNames().filter(function (x) { return hasName(present, x) || sameName(x, name); })
      .concat(present.filter(function (x) { return !hasName(speakerNames(), x); }));
    if (!next.length) { status("At least one speaker must be present (an empty list is ignored by the next steps: they keep the last one).", true); renderPass(); return; }
    var before = i > 0 ? presentAt(i - 1) : [];
    var same = before.length === next.length && before.every(function (x) { return hasName(next, x); });
    if (changeLines(i, function (x) { setMeta(x, S.spk.ongoing, same ? null : next.join(", ")); }))
      status(same ? "#" + (i + 1) + ": the same speakers as before it are present: no {" + S.spk.ongoing + "} needed on it."
        : "#" + (i + 1) + ": {" + S.spk.ongoing + ":" + next.join(", ") + "} (from this subtitle on).");
  }
  /// The subtitles that use a speaker (its {speaker}, or in the list of the speakers present)
  function speakerUses(name) {
    return S.subs.filter(function (x) { var sp = getMeta(x, S.spk.speaker); return (sp && sameName(sp, name)) || hasName(splitNames(getMeta(x, S.spk.ongoing)), name); }).length;
  }
  function speakerNameError(name, label) {
    if (!name) return label + " can't be empty.";
    if (/[,{}\n]/.test(name)) return label + " can't contain ',', '{' or '}'.";
    return null;
  }
  /// The popup of the speakers bar: add a speaker (index null), or change one (its name, its alias) / remove it
  function openSpeakerPopup(index, anchor) {
    if (!checkSpeakersPass() || !canEdit()) return;
    var sp = index == null ? null : S.speakers[index];
    var pop = $("teSpkPop");
    pop.innerHTML = '<b>' + (sp ? "Speaker #" + (index + 1) : "New speaker") + '</b>' +
      '<label>Name <input type="text" id="teSpkName" spellcheck="false" placeholder="Nao Jinguuji" value="' + esc(sp ? sp.name : "") + '"></label>' +
      '<label>Alias <input type="text" id="teSpkAlias" spellcheck="false" placeholder="Nao (optional: shown here only)" value="' + esc(sp && sp.alias ? sp.alias : "") + '"></label>' +
      (sp ? '<div class="hint">The name is what is written ({' + esc(S.spk.speaker) + '} / {' + esc(S.spk.ongoing) + '}): changing it changes it in all the subtitles (' + speakerUses(sp.name) + ').</div>' : '') +
      '<div style="display:flex;gap:6px;justify-content:flex-end">' +
      (sp ? '<button class="mini danger" data-spkpop="remove">Remove</button><div class="spacer"></div>' : '') +
      '<button class="mini" data-spkpop="cancel">Cancel</button><button class="mini primary" data-spkpop="ok">' + (sp ? "OK" : "Add") + '</button></div>';
    pop.setAttribute("data-index", index == null ? "" : String(index));
    pop.style.display = "";
    var r = anchor.getBoundingClientRect();
    pop.style.left = Math.max(8, Math.min(r.left, window.innerWidth - pop.offsetWidth - 8)) + "px";
    pop.style.top = Math.max(8, Math.min(r.bottom + 4, window.innerHeight - pop.offsetHeight - 8)) + "px";
    $("teSpkName").focus();
  }
  function closeSpeakerPopup() { $("teSpkPop").style.display = "none"; $("teSpkPop").innerHTML = ""; }
  function speakerPopupOk() {
    var pop = $("teSpkPop"), idx = pop.getAttribute("data-index");
    var index = idx === "" ? null : parseInt(idx, 10);
    var name = $("teSpkName").value.trim(), alias = $("teSpkAlias").value.trim() || null;
    var error = speakerNameError(name, "The name") || (alias ? speakerNameError(alias, "The alias") : null);
    if (!error && S.speakers.some(function (x, k) { return k !== index && sameName(x.name, name); })) error = "'" + name + "' is already in the list.";
    if (error) { status(error, true); return; }
    if (index == null) {
      S.speakers.push({ name: name, alias: alias });
      status("'" + name + "' added to the speakers (#" + S.speakers.length + (S.speakers.length <= 9 ? ", key " + (keys["speaker" + S.speakers.length] || "-") : "") + ").");
    } else {
      var old = S.speakers[index].name;
      if (old !== name) {
        // (the name is in the subtitles: changed everywhere, one undo)
        pushUndo();
        S.subs.forEach(function (x) {
          var sp = getMeta(x, S.spk.speaker);
          if (sp && sameName(sp, old)) setMeta(x, S.spk.speaker, name);
          var present = splitNames(getMeta(x, S.spk.ongoing));
          if (hasName(present, old)) setMeta(x, S.spk.ongoing, present.map(function (p) { return sameName(p, old) ? name : p; }).join(", "));
        });
        renderList(); restoreSel(); renderCur();
      }
      S.speakers[index] = { name: name, alias: alias };
      status("Speaker #" + (index + 1) + ": " + name + (alias ? " (" + alias + ")" : "") + ".");
    }

    updateUnsaved();
  }
  function speakerPopupRemove() {
    var index = parseInt($("teSpkPop").getAttribute("data-index"), 10), sp = S.speakers[index];
    if (!sp) return;
    var used = speakerUses(sp.name);
    if (used) { status("'" + sp.name + "' is used in " + used + " subtitle(s): remove it from them first.", true); return; }

  $("teSpkPop").addEventListener("click", function (e) {

  /// The review warnings of the selected subtitle (of the kind chosen in the tree): checked (then the next one to do), or not checked anymore
  function toggleChecked() {
    var sub = S.subs[S.sel];
    if (!sub) return;
    var mine = issuesOf(sub).filter(inFilter);
    if (!mine.length) { status("#" + (S.sel + 1) + " has no review warning" + (S.issueFilter ? " of '" + filterLabel() + "'" : "") + ".", true); return; }
    var anyOpen = mine.some(function (x) { return !x.checked; });
    var ok = changeLines(S.sel, function (x) {
      mine.forEach(function (iss) {
        x.lines[iss.li] = anyOpen ? x.lines[iss.li].replace("[REVIEW:", "[CHECKED:") : x.lines[iss.li].replace("[CHECKED:", "[REVIEW:");
      });
    });
    if (ok && anyOpen && currentPass() === "issues") goTodo(1);
    else if (ok && !anyOpen) status("#" + (S.sel + 1) + ": its warnings are not checked anymore.");
  }
  $("teMid").addEventListener("click", function (e) {
    if (!S || !S.info) return;

  $("teMid").addEventListener("change", function (e) {

    else if (e.target.id === "tePropName" || e.target.id === "tePropValue") { e.preventDefault(); addProperty(); }
  });

  // ---- The list and the selected subtitle ----
  function textHtml(sub) {
    var issues = [];
    sub.lines.forEach(function (l) { var x = parseIssue(l); if (x) issues.push(x); });
    var meta = propsOf(sub).map(function (p) { return p.name + (p.value ? ":" + p.value : ""); });
    var text = textOf(sub);
    return issues.map(function (x) {
      var c = issueColor(x.code);
      return '<span class="te-chip te-iss' + (x.checked ? " chk" : "") + '" style="border-color:' + c + ';color:' + c + '" title="' + esc((x.checked ? "Checked: " : "") + x.msg) + '">' +
        (x.checked ? "✓ " : "⚑ ") + esc(x.code + (x.detail ? ":" + x.detail : "")) + '</span>';
    }).join("") +
      meta.map(function (m) { return '<span class="te-chip" title="' + esc(m) + '">' + esc(m) + '</span>'; }).join("") + esc(text.join(" ⏎ "));
  }
  function rowHtml(sub, i) {
    return '<span class="n">' + (sub.v ? "✓" : "") + (i + 1) + '</span><span class="tm">' + fmt(sub.s) + '</span><span class="tm">' + fmt(sub.e) +
      '</span><span class="tm">' + fmtDur(sub.e - sub.s) + '</span><span class="tx">' + textHtml(sub) + '</span>';
  }
  function renderRow(i) {

    S.rowEls[i].classList.toggle("ok", !!S.subs[i].v);

  function renderList() {

    S.rowEls = $("teList").querySelectorAll(".te-row[data-i]");

  }
  function renderCur() {
    renderSpeakerBar();
    var sub = S.subs[S.sel];
    if (!sub) { $("teCur").innerHTML = '<div class="tm">No subtitle selected.</div>'; return; }
    var partNote = "";
    if (S.info && S.info.parts.length > 1) {
      var p = partAt(sub.s);
      partNote = " · part " + (p + 1) + " at " + fmt(sub.s - S.info.parts[p].offsetMs);
    }
    // (the speaker: its own, or the only one present, or the AI decides)
    var speakerNote = "";
    if (S.spk) {
      var st = speakerStateAt(S.sel), kind = speakerKind(st);
      speakerNote = " · speaker: " + (kind === "tagged" ? st.speaker : kind === "single" ? st.present[0] + " (only one present)" : kind === "ai" ? "the AI decides (" + st.present.join(", ") + ")" : "nobody present");
    }
    var props = propsOf(sub);
    var issues = [];
    sub.lines.forEach(function (l, li) { var x = parseIssue(l); if (x) { x.li = li; issues.push(x); } });
    $("teCur").innerHTML = '<div class="tm">' + (sub.v ? '<b style="color:var(--ok)">✓ timing validated</b> · ' : '') + '#' + (S.sel + 1) + ' · ' + fmt(sub.s) + ' → ' + fmt(sub.e) + ' · ' + fmtDur(sub.e - sub.s) + ' s' + esc(partNote) + esc(speakerNote) + '</div>' +
      '<div class="te-text">' + esc(textOf(sub).join("\n")) + '</div>' +
      (props.length ? '<div>' + props.map(function (p) { return '<span class="te-chip" title="' + esc(p.value) + '">' + esc(p.name + (p.value ? ": " + p.value : "")) + '</span>'; }).join("") + '</div>' : '') +
      issues.map(function (x) {
        var c = issueColor(x.code);
        return '<div class="te-issrow' + (x.checked ? " chk" : "") + '" data-issueli="' + x.li + '" title="Click: ' + (x.checked ? "not checked anymore" : "checked") + '">' +

        item("mergePrev", "⤒ Merge with the previous one", i === 0) + item("mergeNext", "⤓ Merge with the next one", i === S.subs.length - 1) +
        '<div class="sep"></div>' +
        item("toggleValidated", sub.v ? "✓ Not validated" : "✓ Validated") + item("validateUpTo", "✓ Validate up to this one") +
        '<div class="sep"></div>' +
        item("delete", "✕ Delete");
    };
    var html = "";
    // (the subtitle of the menu: its actions are done on it, even if the selection changed meanwhile, ex. the playback continued)
    menuEl._sub = S.subs[hit >= 0 ? hit : S.sel] || null;
    if (hit >= 0) {
      if (hit !== S.sel) select(hit, true, true);
      html = subItems(hit, "");
    } else {
      menuEl._ms = addAtMs;
      html = '<div class="mh">' + fmt(addAtMs) + '</div>' + item("addHere", "＋ Add a subtitle here");
      if (S.subs[S.sel]) html += '<div class="sep"></div>' + subItems(S.sel, "Selected: ");
    }
    menuEl.innerHTML = html;
    menuEl.style.display = "";
    // (in the window, next to the mouse)
    var w = menuEl.offsetWidth, h = menuEl.offsetHeight;
    menuEl.style.left = Math.max(4, Math.min(clientX, window.innerWidth - w - 4)) + "px";
    menuEl.style.top = Math.max(4, Math.min(clientY, window.innerHeight - h - 4)) + "px";
  }
  cv.addEventListener("contextmenu", function (e) {
    if (!S || !S.info) return;
    e.preventDefault();
    var ms = msAt(cv, e);
    showMenu(e.clientX, e.clientY, subAt(ms), ms);
  });
  $("teList").addEventListener("contextmenu", function (e) {
    var row = e.target.closest ? e.target.closest(".te-row[data-i]") : null;
    if (!row || !S || !S.info) return;
    e.preventDefault();
    showMenu(e.clientX, e.clientY, parseInt(row.getAttribute("data-i"), 10));
  });
  menuEl.addEventListener("mousedown", function (e) { e.stopPropagation(); });
  menuEl.addEventListener("click", function (e) {
    var it = e.target.closest ? e.target.closest("[data-mact]") : null;
    if (!it || it.classList.contains("off") || !S) return;
    var act = it.getAttribute("data-mact");
    hideMenu();
    if (act === "addHere") { S.highlight = null; addSubtitle(menuEl._ms); return; }
    // (the subtitle of the menu is selected again: still there, maybe at another place in the list)
    var target = menuEl._sub ? S.subs.indexOf(menuEl._sub) : -1;
    if (menuEl._sub && target < 0) { status("The subtitle of the menu is not there anymore.", true); return; }
    if (target >= 0 && target !== S.sel) select(target, true, true);
    if (act === "splitHere") { splitSubtitle(S.sel, menuEl._splitMs != null ? menuEl._splitMs : curMs()); return; }
    run(act);
  });
  window.addEventListener("mousedown", function () { hideMenu(); });
  window.addEventListener("blur", hideMenu);

  // ---- Buttons (the same actions as the keys: the key is in the tooltip) ----
  var TOOLS = [
    ["prevSub", "▲"], ["nextSub", "▼"], ["nextSpeech", "⇥"], null,
    ["playSub", "▶"], ["loopStart", "⟲"], ["loopEnd", "⟳"], ["stop", "■"], null,
    ["add", "＋"], ["delete", "✕"], ["split", "✂"], ["mergePrev", "⤒"], ["mergeNext", "⤓"], null,
    ["toggleValidated", "✓"], ["validateUpTo", "✓⇡"], ["checkIssue", "⚑"], null,
    ["undo", "↶"], ["redo", "↷"]
  ];
  function renderTools() {
    var labelOf = {};
    ACTIONS.forEach(function (a) { labelOf[a.id] = a.label; });
    $("teTools").innerHTML = TOOLS.map(function (t) {
      if (!t) return '<span class="sep"></span>';
      return '<button class="mini" data-act="' + t[0] + '" title="' + esc(labelOf[t[0]] + (keys[t[0]] ? " (" + keys[t[0]] + ")" : "")) + '">' + esc(t[1]) + '</button>';
    }).join("");
  }
  $("teTools").addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest("[data-act]") : null;
    if (!b || !S || !S.info) return;
    b.blur();   // (the keys go to the editor, not to the button)
    run(b.getAttribute("data-act"));
  });
  renderTools();

  // ---- Settings tab (remembered by this browser) ----
  function numSetting(id, value, min, max, step, width) {
    return '<input type="number" id="' + id + '" min="' + min + '" max="' + max + '" step="' + step + '" style="width:' + width + 'px" value="' + value + '">';
  }
  function renderSettings() {
    $("teSettingsPane").innerHTML =
      '<div class="te-set"><b>Padding (ms)</b> start ' + numSetting("tePadStart", settings.padStartMs || 0, -5000, 5000, 10, 64) + ' end ' + numSetting("tePadEnd", settings.padEndMs || 0, -5000, 5000, 10, 64) +
      '<span class="hint">added to the start / the end of the subtitles whose timing is NOT validated (+ = longer, - = shorter), right away. Only in the editor: the file keeps their timing without it, until they are validated (then their timing with the padding is their timing; save to keep it).</span></div>' +
      '<div class="te-set"><b>Faster between subtitles</b> ' + numSetting("teFastRate", settings.fastRate, 100, 800, 25, 56) + ' % from ' + numSetting("teFastAfter", settings.fastAfterMs, 0, 10000, 100, 64) + ' ms after a subtitle until ' +
      numSetting("teFastBefore", settings.fastBeforeMs, 0, 10000, 100, 64) + ' ms before the next one, when the gap is at least ' + numSetting("teFastMinGap", settings.fastMinGapMs, 0, 60000, 500, 64) + ' ms' +
      '<span class="hint">(100 %: off). Play during that time: back 1 s, and normal speed for 3 s.</span></div>' +
      '<div class="te-set"><b>Start / end loops</b> play ' + numSetting("teAudMs", settings.auditionMs, 100, 5000, 50, 64) + ' ms at the edge, wait ' + numSetting("teGapMs", settings.auditionGapMs, 0, 3000, 50, 64) +
      ' ms, at most ' + numSetting("teAudMax", settings.auditionMax, 0, 99, 1, 44) + ' times<span class="hint">(0: no limit), then it plays on, like Play.</span></div>' +
      '<div class="te-set"><b>After a change of an edge</b><label><input type="checkbox" id="teReplayOpt"' + (settings.replayAfterEdit ? " checked" : "") + '> replay the whole subtitle</label>' +
      '<span class="hint">(instead of its start / end again and again; and Play during a start / end loop: from the start of the subtitle, otherwise from the edge being played)</span></div>' +
      '<div class="te-set"><b>Saved automatically</b> every ' + numSetting("teAutoSave", settings.autoSaveMin, 0, 60, 1, 48) + ' minutes while there are changes<span class="hint">(0: never). It saves the review (in the .wipsubtitles), not the file: the file is written when the review is done.</span></div>';
  }
  $("teSettingsPane").addEventListener("change", function (e) {
    if (e.target.id !== "teReplayOpt") return;
    settings.replayAfterEdit = e.target.checked;
    savePref("fstTimingSettings", JSON.stringify(settings));
    e.target.blur();   // (the keys go to the editor)
  });
  $("teSettingsPane").addEventListener("input", function (e) {
    var v = parseInt(e.target.value, 10);
    if (isNaN(v)) return;
    switch (e.target.id) {
      case "tePadStart": settings.padStartMs = clamp(v, -5000, 5000); break;
      case "tePadEnd": settings.padEndMs = clamp(v, -5000, 5000); break;
      case "teFastRate": settings.fastRate = clamp(v, 100, 800); break;
      case "teFastAfter": settings.fastAfterMs = clamp(v, 0, 10000); break;
      case "teFastBefore": settings.fastBeforeMs = clamp(v, 0, 10000); break;
      case "teFastMinGap": settings.fastMinGapMs = clamp(v, 0, 60000); break;
      case "teAudMs": settings.auditionMs = clamp(v, 100, 5000); break;
      case "teGapMs": settings.auditionGapMs = clamp(v, 0, 3000); break;
      case "teAudMax": settings.auditionMax = clamp(v, 0, 99); break;
      case "teAutoSave": settings.autoSaveMin = clamp(v, 0, 60); break;
      default: return;
    }
    savePref("fstTimingSettings", JSON.stringify(settings));
    // (the padding: the subtitles not validated move right away)
    if ((e.target.id === "tePadStart" || e.target.id === "tePadEnd") && S && S.info) applyPadding();
  });

  // ---- The tabs under the video ----
  var TE_TABS = [["subtitle", "Subtitle"], ["properties", "{ } Properties"], ["warnings", "⚑ Warnings"], ["settings", "⚙ Settings"], ["keys", "⌨ Keys"]];
  var teTab = loadPref("fstTimingTab") || "subtitle";
  if (!TE_TABS.some(function (t) { return t[0] === teTab; })) teTab = "subtitle";
  function showTab(id) {
    teTab = id; savePref("fstTimingTab", id);
    capturing = null;
    $("teTabs").innerHTML = TE_TABS.map(function (t) { return '<button class="mini' + (t[0] === id ? " on" : "") + '" data-tab="' + t[0] + '">' + esc(t[1]) + '</button>'; }).join("");
    document.querySelectorAll("#te .te-tabpane").forEach(function (p) { p.style.display = p.getAttribute("data-pane") === id ? "" : "none"; });
    if (id === "settings") renderSettings();
    else if (id === "keys") renderHelp();
    else if (S && S.info) renderPass();
  }
  $("teTabs").addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest("[data-tab]") : null;
    if (!b) return;
    b.blur();
    showTab(b.getAttribute("data-tab"));
  });

  function run(action) {
    var t = curMs();
    switch (action) {
      case "playPause":
        if (audition) continueAfterLoop();
        // (going fast between subtitles: back 1 s, and normal speed for 3 s)
        else if (isPlaying() && S.fast) { S.slowUntil = t - 1000 + 3000; seek(t - 1000); updateSpeed(true, t - 1000); }
        else if (isPlaying()) pause();
        else play();
        break;
      case "toggleValidated": if (S.subs[S.sel] && canEdit()) setValidated(S.sel, !S.subs[S.sel].v); break;
      case "validateUpTo":
        if (!canEdit()) break;
        for (var vi = 0; vi <= S.sel && vi < S.subs.length; vi++) setValidated(vi, true);
        status("Validated up to #" + (S.sel + 1) + ".");
        break;
      case "playSub": playSub(); break;
      case "loopStart": startAudition("start"); break;
      case "loopEnd": startAudition("end"); break;
      case "stop": stopAudition(); pause(); break;
      case "prevSub": select(S.sel > 0 ? S.sel - 1 : 0); break;
      case "nextSub": select(S.sel < 0 ? 0 : Math.min(S.subs.length - 1, S.sel + 1)); break;
      case "nextSpeech": nextSpeech(); break;
      case "back": seek(t - 1000); break;
      case "forward": seek(t + 1000); break;
      case "backFine": seek(t - 100); break;
      case "forwardFine": seek(t + 100); break;
      case "zoomIn": zoom(0.8, t >= S.viewStart && t <= S.viewStart + S.viewDur ? t : S.viewStart + S.viewDur / 2); break;
      case "zoomOut": zoom(1.25, t >= S.viewStart && t <= S.viewStart + S.viewDur ? t : S.viewStart + S.viewDur / 2); break;
      case "add": addSubtitle(); break;
      case "delete": deleteSubtitle(); break;
      case "mergePrev": mergeWithPrevious(S.sel); break;
      case "mergeNext": mergeWithPrevious(S.sel + 1); break;
      case "split": splitSubtitle(S.sel, curMs()); break;
      case "undo": restore(S.undo, S.redo); break;
      case "redo": restore(S.redo, S.undo); break;
      case "save": save(false); break;
      case "nextTodo": goTodo(1); break;
      case "prevTodo": goTodo(-1); break;
      case "checkIssue": toggleChecked(); break;
      default:
        if (/^speaker[1-9]$/.test(action)) speakerByIndex(parseInt(action.slice(7), 10) - 1);
        break;
    }
  }

  var capturing = null;   // the action that waits for its new key (Keys panel)
  document.addEventListener("keydown", function (e) {
    if (!S) return;
    if (capturing) {
      e.preventDefault(); e.stopPropagation();
      var combo = comboOf(e);
      if (!combo) return;
      if (combo !== "Escape") {
        // (the key is moved: the action that had it has no key anymore)
        for (var id in keys) if (keys[id] === combo) keys[id] = "";
        keys[capturing] = combo;
        saveKeys();
      }
      capturing = null;
      renderHelp();
      return;
    }
    var tag = e.target && e.target.tagName;
    if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") {
      // (typing: the keys are for the text; Escape goes back to the editor, Ctrl+S still saves)
      if (e.key === "Escape") { e.preventDefault(); e.target.blur(); return; }
      if (keyMap[comboOf(e)] !== "save") return;
    }
    var action = keyMap[comboOf(e)];
    if (!action || !S.info) return;
    e.preventDefault(); e.stopPropagation();
    run(action);
  }, true);

  // ---- Keys panel ----
  function renderHelp() {
    var rows = ACTIONS.map(function (a) {
      return '<tr><td>' + esc(a.label) + '</td><td style="text-align:right;white-space:nowrap"><kbd data-key="' + a.id + '" class="' + (capturing === a.id ? "wait" : "") + '" title="Click, then press the new key (Escape: cancel)">' +
        esc(capturing === a.id ? "press a key..." : (keys[a.id] || "(none)")) + '</kbd></td></tr>';
    }).join("");
    $("teHelp").innerHTML =
      '<div style="display:flex;align-items:center;gap:8px"><b>Keys</b><div class="spacer"></div><button class="mini" data-reset="1">Default keys</button></div>' +
      '<div class="note">Click on a key to change it (remembered by this browser).</div>' +
      '<table>' + rows + '</table>' +
      '<div class="note"><b>Click</b> (timeline) = go there and select the subtitle there &middot; drag = move the view &middot; wheel = scroll &middot; Ctrl+wheel = zoom &middot; Shift+wheel = taller / shorter waveform &middot; right click = menu. The bar under the timeline is the whole scene (click: go there).</div>' +
      '<div class="note"><b>Ctrl+click</b>: moves an edge there (Ctrl+drag: it follows the mouse), then plays it again and again. In a subtitle: its start (left half) or its end (right half). Between two subtitles: the end of the previous one or the start of the next one (the nearest). Right on the edge (' + EDGE_KEEP_PX + ' pixels): only plays it. Then Play: plays and continues, from the start of the subtitle (option "Replay the whole subtitle after a change"), otherwise from the edge being played.</div>' +
      '<div class="note"><b>Timing validated</b> (&#10003;, green): a subtitle\'s timing is validated by itself when the playback goes 0.2 s past its end (without a stop since before its end). Saved with the review (in the .wipsubtitles).</div>' +
      '<div class="note"><b>Passes</b> (above the list): Timing, Review warnings, Speakers (choosing one also opens its tab). Each one says what is to do (&#9679; in the list); "next to do" goes from one to the other. Next time, the editor starts at the first one to do in the current pass. ' +
      '<b>Review warnings</b>: the [REVIEW:Code:Detail] lines of the preparer, by kind (tree): checked one by one (they become [CHECKED:...]). ' +
      '<b>Speakers</b>: the list of the speakers; the checkboxes = who is present from the selected subtitle on ({OngoingSpeakers}, added only where it changes); a name = the speaker of the selected subtitle ({Speaker}). A deleted subtitle gives its {Ongoing...} metadata to the next one.</div>' +
      '<div class="note">Terrain band (under the ruler): <span style="color:' + esc(colors.ok) + '">&#9632; speech</span> <span style="color:' + esc(colors.warn) + '">&#9632; breath</span> <span style="color:' + esc(colors.muted) + '">&#9632; click</span>.</div>';
  }
  $("teHelp").addEventListener("click", function (e) {
    var k = e.target.getAttribute && e.target.getAttribute("data-key");
    if (k) { capturing = k; renderHelp(); return; }
    if (e.target.getAttribute && e.target.getAttribute("data-reset")) { savePref("fstTimingKeys", null); loadKeys(); renderHelp(); return; }
  });
  $("teCloseBtn").onclick = close;
  showTab(teTab);
  // (after a choice, the keys go to the editor again, not to the list)
  $("teFile").onchange = function () {
    if (!S) return;
    $("teFile").blur();
    if (S.unsaved && !window.confirm("The changes are not saved. Open the other review anyway (they are lost)?")) { $("teFile").value = S.review; return; }
    S.review = $("teFile").value; savePref("fstTimingReview", S.review); loadSubs();
  };
  $("teAudio").onchange = function () {
    if (!S) return;
    $("teAudio").blur();
    var v = $("teAudio").value || null;
    if (v) savePref("fstTimingAudio", v);
    status(null);
    setAudio(v);
  };

  window.fstTiming = {
    open: open, close: close,
    // (read only, for the tests of the page: the view of the timeline [start ms, duration ms])
    view: function () { return S ? [S.viewStart, S.viewDur] : null; }
  };
})();
</script>
</body>
</html>
